<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏤͟͟Tʜᴜɴᴅᴇʀ | Neon Developer Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bc13fe;
            --neon-green: #39ff14;
            --neon-yellow: #ffff00;
            --neon-orange: #ff6600;
            --neon-red: #ff073a;
            --neon-blue: #0066ff;
            --dark-bg: #0a0a0f;
            --darker-bg: #050508;
            --glass: rgba(255,255,255,0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            line-height: 1.8;
        }

        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 0, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(188, 19, 254, 0.05) 0%, transparent 70%),
                var(--darker-bg);
        }

        .bg-animation::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }

        .particle {
            position: absolute; width: 3px; height: 3px;
            background: var(--neon-cyan); border-radius: 50%;
            animation: float 15s infinite;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            background: rgba(5, 5, 8, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .logo {
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
            letter-spacing: 3px;
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan); }
            50% { text-shadow: 0 0 30px var(--neon-cyan), 0 0 60px var(--neon-cyan), 0 0 80px var(--neon-cyan); }
        }

        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a {
            color: #e0e0e0; text-decoration: none;
            font-family: 'Orbitron', sans-serif; font-size: 0.85rem;
            letter-spacing: 2px; position: relative; padding: 5px 0;
            transition: all 0.3s;
        }

        .nav-links a::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 0; height: 2px; background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan); transition: width 0.3s;
        }

        .nav-links a:hover { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        .nav-links a:hover::after { width: 100%; }

        .hero {
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 120px 20px 50px; position: relative;
        }

        .hero-badge {
            display: inline-block; padding: 8px 25px;
            border: 1px solid var(--neon-cyan); border-radius: 30px;
            color: var(--neon-cyan); font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem; letter-spacing: 3px; margin-bottom: 30px;
            animation: borderGlow 2s ease-in-out infinite alternate;
            background: rgba(0, 243, 255, 0.05);
        }

        @keyframes borderGlow {
            from { box-shadow: 0 0 5px var(--neon-cyan), inset 0 0 5px var(--neon-cyan); }
            to { box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 10px var(--neon-cyan); }
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 6rem); font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(0, 243, 255, 0.5));
            margin-bottom: 20px; letter-spacing: 5px;
            animation: titleGlitch 5s infinite;
        }

        @keyframes titleGlitch {
            0%, 90%, 100% { transform: translate(0); filter: drop-shadow(0 0 30px rgba(0, 243, 255, 0.5)); }
            92% { transform: translate(-3px, 2px); filter: drop-shadow(0 0 30px rgba(255, 0, 255, 0.5)); }
            94% { transform: translate(3px, -2px); filter: drop-shadow(0 0 30px rgba(0, 243, 255, 0.5)); }
            96% { transform: translate(-2px, 1px); filter: drop-shadow(0 0 30px rgba(188, 19, 254, 0.5)); }
        }

        .hero-subtitle {
            font-family: 'Share Tech Mono', monospace; font-size: 1.2rem;
            color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green);
            margin-bottom: 15px; letter-spacing: 2px;
        }

        .hero-desc {
            max-width: 700px; font-size: 1.1rem; color: #aaa;
            margin-bottom: 40px; line-height: 1.8;
        }

        .hero-socials { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

        .social-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 30px; border: 1px solid; border-radius: 8px;
            text-decoration: none; font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem; letter-spacing: 2px;
            transition: all 0.3s; position: relative; overflow: hidden;
        }

        .social-btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .social-btn:hover::before { left: 100%; }

        .social-btn.telegram { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .social-btn.telegram:hover { background: var(--neon-cyan); color: var(--dark-bg); box-shadow: 0 0 30px var(--neon-cyan); }
        .social-btn.github { border-color: var(--neon-purple); color: var(--neon-purple); box-shadow: 0 0 10px rgba(188, 19, 254, 0.2); }
        .social-btn.github:hover { background: var(--neon-purple); color: #fff; box-shadow: 0 0 30px var(--neon-purple); }
        .social-btn.group { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); }
        .social-btn.group:hover { background: var(--neon-green); color: var(--dark-bg); box-shadow: 0 0 30px var(--neon-green); }

        .scroll-indicator { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); animation: bounce 2s infinite; }
        .scroll-indicator i { color: var(--neon-cyan); font-size: 2rem; text-shadow: 0 0 20px var(--neon-cyan); }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-15px); }
            60% { transform: translateX(-50%) translateY(-7px); }
        }

        section { padding: 100px 50px; max-width: 1400px; margin: 0 auto; }

        .section-header { text-align: center; margin-bottom: 60px; }
        .section-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800;
            margin-bottom: 15px; position: relative; display: inline-block;
        }
        .section-header h2::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            box-shadow: 0 0 20px var(--neon-cyan);
        }
        .section-header p { color: #888; font-size: 1.1rem; margin-top: 25px; }

        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
        .about-image { position: relative; display: flex; justify-content: center; align-items: center; }

        .avatar-ring {
            width: 300px; height: 300px; border-radius: 50%;
            border: 3px solid var(--neon-cyan);
            display: flex; justify-content: center; align-items: center;
            position: relative;
            animation: ringRotate 10s linear infinite;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), inset 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .avatar-ring::before, .avatar-ring::after {
            content: ''; position: absolute; border-radius: 50%; border: 2px solid;
        }
        .avatar-ring::before { width: 340px; height: 340px; border-color: var(--neon-pink); animation: ringRotate 15s linear infinite reverse; opacity: 0.5; }
        .avatar-ring::after { width: 380px; height: 380px; border-color: var(--neon-purple); animation: ringRotate 20s linear infinite; opacity: 0.3; }

        @keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .avatar-inner {
            width: 250px; height: 250px; border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900;
            color: var(--dark-bg); text-shadow: 0 0 20px rgba(255,255,255,0.5);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.5);
        }

        .about-content h3 {
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem;
            color: var(--neon-cyan); margin-bottom: 20px; text-shadow: 0 0 20px var(--neon-cyan);
        }
        .about-content p { color: #bbb; font-size: 1.05rem; margin-bottom: 20px; text-align: justify; }

        .about-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .stat-card {
            background: var(--glass); border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 15px; padding: 25px 15px; text-align: center;
            backdrop-filter: blur(10px); transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--neon-cyan); box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2); }
        .stat-card .stat-num { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); }
        .stat-card .stat-label { font-size: 0.85rem; color: #888; margin-top: 5px; letter-spacing: 2px; }

        .skills-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .skill-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 35px; position: relative;
            overflow: hidden; transition: all 0.4s; backdrop-filter: blur(10px);
        }
        .skill-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            opacity: 0; transition: opacity 0.3s;
        }
        .skill-card:hover { transform: translateY(-10px); border-color: rgba(0, 243, 255, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.1); }
        .skill-card:hover::before { opacity: 1; }

        .skill-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .skill-name { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .skill-name i { font-size: 1.8rem; }
        .skill-percent { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; }

        .circular-progress { position: relative; width: 160px; height: 160px; margin: 20px auto; }
        .circular-progress svg { transform: rotate(-90deg); }
        .circular-progress circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .circular-progress .bg-circle { stroke: rgba(255,255,255,0.05); }
        .circular-progress .progress-circle { stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 2s ease-out; filter: drop-shadow(0 0 10px currentColor); }
        .circular-progress .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; }
        .skill-desc { color: #999; font-size: 0.95rem; margin-top: 15px; text-align: center; line-height: 1.7; }

        .skill-card.python-card { grid-column: span 2; background: linear-gradient(135deg, rgba(0, 243, 255, 0.05), rgba(188, 19, 254, 0.05)); border: 1px solid rgba(0, 243, 255, 0.2); }
        .skill-card.python-card .skill-name { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); }
        .skill-card.python-card .progress-circle { stroke: var(--neon-cyan); }
        .skill-card.python-card .progress-text { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); }
        .skill-card.python-card .skill-percent { color: var(--neon-cyan); }

        .skill-card.html-card .skill-name { color: var(--neon-orange); text-shadow: 0 0 20px var(--neon-orange); }
        .skill-card.html-card .progress-circle { stroke: var(--neon-orange); }
        .skill-card.html-card .progress-text { color: var(--neon-orange); text-shadow: 0 0 20px var(--neon-orange); }
        .skill-card.html-card .skill-percent { color: var(--neon-orange); }

        .skill-card.java-card .skill-name { color: var(--neon-red); text-shadow: 0 0 20px var(--neon-red); }
        .skill-card.java-card .progress-circle { stroke: var(--neon-red); }
        .skill-card.java-card .progress-text { color: var(--neon-red); text-shadow: 0 0 20px var(--neon-red); }
        .skill-card.java-card .skill-percent { color: var(--neon-red); }

        .skill-card.cpp-card .skill-name { color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); }
        .skill-card.cpp-card .progress-circle { stroke: var(--neon-blue); }
        .skill-card.cpp-card .progress-text { color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); }
        .skill-card.cpp-card .skill-percent { color: var(--neon-blue); }

        .desc-section {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.03), rgba(255, 0, 255, 0.03));
            border: 1px solid rgba(0, 243, 255, 0.1); border-radius: 25px;
            padding: 60px; margin-top: 50px; position: relative; overflow: hidden;
        }
        .desc-section::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.03) 0%, transparent 60%);
            animation: descGlow 10s ease-in-out infinite;
        }
        @keyframes descGlow { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(25%, 25%); } }
        .desc-content { position: relative; z-index: 1; }

        .desc-block {
            margin-bottom: 40px; padding: 30px; background: rgba(0,0,0,0.3);
            border-radius: 15px; border-left: 4px solid var(--neon-cyan);
            transition: all 0.3s;
        }
        .desc-block:hover { background: rgba(0,0,0,0.5); transform: translateX(10px); box-shadow: -10px 0 30px rgba(0, 243, 255, 0.1); }
        .desc-block h3 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--neon-cyan); margin-bottom: 15px; display: flex; align-items: center; gap: 12px; }
        .desc-block h3 i { font-size: 1.6rem; }
        .desc-block p { color: #bbb; font-size: 1rem; line-height: 2; text-align: justify; }

        .desc-block.java-block { border-left-color: var(--neon-red); }
        .desc-block.java-block h3 { color: var(--neon-red); }
        .desc-block.express-block { border-left-color: var(--neon-green); }
        .desc-block.express-block h3 { color: var(--neon-green); }
        .desc-block.clone-block { border-left-color: var(--neon-purple); }
        .desc-block.clone-block h3 { color: var(--neon-purple); }

        .code-block {
            background: #0d0d12; border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px; padding: 20px; margin: 15px 0;
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
            color: var(--neon-cyan); overflow-x: auto; position: relative;
        }
        .code-block::before { content: '>'; position: absolute; left: 10px; top: 20px; color: var(--neon-green); }
        .code-block code { padding-left: 20px; display: block; line-height: 1.8; }

        .coming-soon { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .soon-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 40px 30px; text-align: center;
            position: relative; overflow: hidden; transition: all 0.4s; backdrop-filter: blur(10px);
        }
        .soon-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent, rgba(0, 243, 255, 0.05), transparent);
            opacity: 0; transition: opacity 0.3s;
        }
        .soon-card:hover::before { opacity: 1; }
        .soon-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--neon-cyan); box-shadow: 0 20px 50px rgba(0, 243, 255, 0.15); }

        .soon-icon { width: 80px; height: 80px; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 25px; font-size: 2.5rem; position: relative; }
